<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Surveillance AI — Safety Alert</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:#0A0A0F; color:#F0F0F5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:420px; margin:0 auto; padding:24px 20px 48px; }
  .spinner { width:28px; height:28px; margin:80px auto 20px; border-radius:50%;
    border:3px solid rgba(0,229,255,0.2); border-top-color:#00E5FF;
    animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .center { text-align:center; }
  .center p { color:#8888A0; font-size:14px; line-height:1.5; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#8888A0; font-size:13px; margin:0 0 20px; }
  .badge { display:inline-block; padding:5px 12px; border-radius:9999px; font-size:11px;
    font-weight:600; letter-spacing:0.8px; text-transform:uppercase; margin-bottom:16px; }
  .badge.high { background:rgba(255,61,61,0.12); color:#FF3D3D; border:1px solid rgba(255,61,61,0.30); }
  .badge.medium { background:rgba(255,215,64,0.12); color:#FFD740; border:1px solid rgba(255,215,64,0.30); }
  .badge.low { background:rgba(0,230,118,0.12); color:#00E676; border:1px solid rgba(0,230,118,0.30); }
  .ack-banner { display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px;
    background:rgba(0,230,118,0.08); border:1px solid rgba(0,230,118,0.25); margin-bottom:20px;
    font-size:13px; color:#00E676; }
  .section-label { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#555568;
    margin:20px 0 8px; }
  .body-text { font-size:14px; line-height:1.6; color:#F0F0F5; margin:0; }
  img.photo { width:100%; border-radius:12px; display:block; margin-bottom:4px; }
  audio { width:100%; margin-top:4px; }
  .transcript { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
    border-radius:10px; padding:14px; font-size:13px; font-style:italic; color:#8888A0; line-height:1.6; }
  .empty { font-size:13px; color:#555568; font-style:italic; }
  .btn { display:inline-block; width:100%; height:52px; line-height:52px; padding:0 28px;
    border-radius:9999px; background:#00E5FF; color:#001F24; font-weight:600;
    text-decoration:none; font-size:15px; text-align:center; margin-top:24px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="center" id="loading">
      <div class="spinner"></div>
      <p>Loading alert…</p>
    </div>
    <div id="content" style="display:none"></div>
  </div>

  <script>
    // Served via GitHub Pages, not Supabase — see share.html/confirm.html
    // for why (Supabase's shared *.supabase.co domain force-rewrites
    // text/html to text/plain). ack-alert stays JSON-only and does the
    // real work: it marks the alert acknowledged on this same request, so
    // simply loading this page is what stops the backup contact from
    // being notified — no separate button to tap for that part.
    var FUNCTIONS_BASE = "https://snhxbkmjqhelmjjpejme.supabase.co/functions/v1/ack-alert";
    var alertId = new URLSearchParams(location.search).get("alertId");

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s == null ? "" : s;
      return d.innerHTML;
    }

    function showError(message) {
      document.getElementById("loading").style.display = "none";
      var el = document.getElementById("content");
      el.style.display = "block";
      el.innerHTML = '<div class="center"><h1>Link unavailable</h1><p>' + esc(message) + "</p></div>";
    }

    function render(data) {
      document.getElementById("loading").style.display = "none";
      var el = document.getElementById("content");
      el.style.display = "block";

      var risk = data.riskLevel || "high";
      var when = data.timestamp ? new Date(data.timestamp).toLocaleString() : "";

      var html = "";
      html += '<span class="badge ' + esc(risk) + '">' + esc(risk) + " risk</span><br/>";
      html += "<h1>Safety Alert</h1>";
      html += '<div class="sub">' + esc(when) + "</div>";
      html += '<div class="ack-banner">✓ You\'ve confirmed you\'ve seen this. No further contact will be notified.</div>';

      html += '<div class="section-label">What was detected</div>';
      html += '<p class="body-text">' + esc(data.aiSummary || "No summary available.") + "</p>";

      if (data.audioSummary) {
        html += '<div class="section-label">Audio</div>';
        html += '<p class="body-text">' + esc(data.audioSummary) + "</p>";
      }

      html += '<div class="section-label">Photo</div>';
      html += data.photoUrl
        ? '<img class="photo" src="' + esc(data.photoUrl) + '" alt="Captured photo"/>'
        : '<p class="empty">No photo was captured for this alert.</p>';

      html += '<div class="section-label">Audio Clip</div>';
      html += data.audioUrl
        ? '<audio controls src="' + esc(data.audioUrl) + '"></audio>'
        : '<p class="empty">No audio clip was captured for this alert.</p>';

      if (data.transcript) {
        html += '<div class="section-label">Transcript</div>';
        html += '<div class="transcript">"' + esc(data.transcript) + '"</div>';
      }

      if (data.location) {
        var mapsUrl = "https://maps.google.com/?q=" + data.location.lat + "," + data.location.lng;
        html += '<a class="btn" href="' + esc(mapsUrl) + '" target="_blank" rel="noopener">Open Event Location in Maps</a>';
      }

      el.innerHTML = html;
    }

    if (!alertId) {
      showError("This link is missing its alert id.");
    } else {
      fetch(FUNCTIONS_BASE + "?alertId=" + encodeURIComponent(alertId))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.error) { showError(data.error); return; }
          render(data);
        })
        .catch(function () {
          showError("Couldn't load this alert. Please try the link again in a moment.");
        });
    }
  </script>
</body>
</html>
